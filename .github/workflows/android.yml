name: android

# Builds the installable Android APK on every change that can affect it.
# The APK targets Android 16 (API 36), runs on Android 7.0+, is a *universal*
# APK (arm64-v8a + armeabi-v7a + x86_64 so phones and x86_64 devices/emulators
# all install it), is 16 KB page-size aligned and is release-signed with the
# project keystore (APK Signature Scheme v1 + v2 + v3).
#
# `install-test` boots an x86_64 Android 14 emulator and really installs,
# launches and checks the built APK.  A build that only looks valid but does
# not install now fails the workflow instead of being published.

on:
  workflow_dispatch:
  push:
    branches: [main, feature/football-master-v1]
    paths:
      - "project.godot"
      - "export_presets.cfg"
      - "icon.svg"
      - "scenes/**"
      - "scripts/**"
      - "tools/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "project.godot"
      - "export_presets.cfg"
      - "icon.svg"
      - "scenes/**"
      - "scripts/**"
      - "tools/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GODOT_VERSION: "4.7.2"
    steps:
      - name: Check out the project
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up the Android SDK
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_HOME:-}" ]; then
            for candidate in "$HOME/Android/Sdk" /usr/local/lib/android/sdk /opt/android-sdk; do
              if [ -d "$candidate/build-tools" ]; then
                echo "ANDROID_HOME=$candidate" >> "$GITHUB_ENV"
                break
              fi
            done
          fi
          [ -n "${ANDROID_HOME:-}" ] || { echo "::error::Android SDK not found"; exit 1; }
          [ -d "$ANDROID_HOME/build-tools" ] || { echo "::error::Android build-tools are missing"; exit 1; }
          echo "SDK: $ANDROID_HOME"
          echo "build-tools: $(ls "$ANDROID_HOME/build-tools" | tr '\n' ' ')"
          echo "platforms: $(ls "$ANDROID_HOME/platforms" | tr '\n' ' ')"

      - name: Decode the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not configured; a release APK cannot be signed"
            exit 1
          fi
          keystore="$RUNNER_TEMP/football-master-release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          chmod 600 "$keystore"
          echo "keystore decoded"

      - name: Build and sign the APK
        env:
          ANDROID_EXPORT_MODE: release
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ runner.temp }}/football-master-release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_EXPECTED_CERT_SHA256: ${{ secrets.ANDROID_CERT_SHA256 }}
        run: bash tools/build_android.sh

      - name: Keep the APK
        uses: actions/upload-artifact@v4
        with:
          name: football-master-android-${{ github.run_id }}
          path: |
            build/android/football-master.apk
            build/android/football-master-certificate.pem
            build/SHA256SUMS
          retention-days: 14
          if-no-files-found: error

      - name: Summary
        run: |
          {
            echo "### Football Master Android APK"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| run | $GITHUB_RUN_ID |"
            echo "| ABI | universal: arm64-v8a, armeabi-v7a, x86_64 |"
            echo "| Android | minSdk 24, targetSdk 36 |"
            echo "| page size | 16 KB aligned |"
            echo "| signature | v1 + v2 + v3, release keystore |"
          } >> "$GITHUB_STEP_SUMMARY"
          cat build/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"

  install-test:
    name: install on an emulator
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: apk
    steps:
      - name: Download the built APK
        uses: actions/download-artifact@v4
        with:
          name: football-master-android-${{ github.run_id }}
          path: dist

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up the Android SDK and the emulator
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_HOME:-}" ]; then
            for candidate in "$HOME/Android/Sdk" /usr/local/lib/android/sdk /opt/android-sdk; do
              if [ -d "$candidate/build-tools" ]; then
                echo "ANDROID_HOME=$candidate" >> "$GITHUB_ENV"
                break
              fi
            done
          fi
          [ -n "${ANDROID_HOME:-}" ] || { echo "::error::Android SDK not found"; exit 1; }
          {
            echo "ANDROID_AVD_HOME=$RUNNER_TEMP/avd"
            echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
            echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
            echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          } >> "$GITHUB_ENV"
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/avd"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "emulator" \
            "system-images;android-34;google_apis;x86_64" >/dev/null
          echo no | avdmanager create avd -n ci \
            -k "system-images;android-34;google_apis;x86_64" --force
          echo "emulator ready"

      - name: Allow the runner to use KVM
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install, launch and check the APK
        run: |
          set -euo pipefail
          emulator -avd ci -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          adb wait-for-device
          for _ in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              break
            fi
            sleep 5
          done
          adb shell getprop sys.boot_completed | grep -q 1 || {
            tail -50 "$RUNNER_TEMP/emulator.log"; exit 1; }

          echo "==> installing the APK"
          adb install -r dist/football-master.apk
          adb shell pm list packages | grep -q 'package:com.mmunki.footballmaster'

          echo "==> resolved launcher"
          adb shell cmd package resolve-activity --brief \
            com.mmunki.footballmaster | tail -1

          echo "==> launching"
          adb shell am start -W \
            -n com.mmunki.footballmaster/com.godot.game.GodotAppLauncher
          sleep 20
          pid="$(adb shell pidof com.mmunki.footballmaster | tr -d '\r')"
          if [ -z "$pid" ]; then
            echo "::error::the game did not stay running after launch"
            adb logcat -d -t 400 | grep -iE 'godot|football|AndroidRuntime|FATAL' || true
            exit 1
          fi
          echo "installed and running as pid $pid"
          adb shell dumpsys package com.mmunki.footballmaster \
            | grep -E 'versionName|primaryCpuAbi' | head -3

      - name: Keep the emulator log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-master-emulator-log-${{ github.run_id }}
          path: ${{ runner.temp }}/emulator.log
          retention-days: 7
          if-no-files-found: ignore
